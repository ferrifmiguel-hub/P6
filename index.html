<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <style>
    .montserrat-cuerpo {
         font-family: "Montserrat", sans-serif;
         font-optical-sizing: auto;
         font-weight: 700;
         font-style: normal;
      }

     *{
        margin: 0;
        padding: 0;
        box-sizing: 0;
     }
     :root{
        --primary-color: purple;
        --secondary-color: black;
     }

     .container{
        display: flex;
        width: 100%;
        height: 100vh;
     }

     h1{
        font-family: "Fredoka", sans-serif;
     }

     h2{
        font-family: "Fredoka", sans-serif;
     }

     a{
        font-family: "Fredoka", sans-serif;
        font-size: 3.5em;
        color:white
     }
    
     #negro{
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
        padding:0 0 700px 0;
        background-color: var(--secondary-color);
        font-family: "Montserrat", sans-serif;
        
      
     }

     section{
        width: 33vw;
        height: 100%;
     }
     
     section {
       height: 50%;
        width: 100%;;
    }
     
     #violeta {
        display: flex;
        width: 100%;
        height: 100%;
        padding:0 0 0 0;
        background-color: var(--primary-color);
        color:white
        
        
     }
    

     
     #morado {
        display: flex;
        justify-content: end;
        align-items: end;
        width: 100%;
        height: 100%;
        margin:700px 0 0 0;
        background-color: var(--primary-color);
        color:white
        
        
     }

     @media (max-width: 600px) {
        .container{
            flex-direction: column;
        }

     }

    </style>
</head>
<body>
    <div class="container">
        
        <section>
            <div id="violeta">
                <h1>Hola</h1>
            </div>
        </section>
        
        <section>
            <div id="negro">
            <a href="http://https://www.figma.com/design/3jlHtghg3Kzfm1Kc6rFqae/Untitled?node-id=24-47&t=oqBzrMpt2GXsET7f-0">FIGMA</a>
            </div>
        </section>
        
        <section>
            <div id="morado">
                
                 <h2>Adiós</h2>
            </div>
             
        </section>
        
    </div>
</body>
</html>
